services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://pgadmin:localpass@db:5432/fpi
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: fpi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d fpi"]
      interval: 5s
      retries: 10

volumes:
  pgdata: